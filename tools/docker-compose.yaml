services:
  duplicati:
    image: duplicati/duplicati:2.4.0.1
    container_name: ${DOCKER_CONTAINER_NAME_PREFIX}_duplicati
    hostname: duplicati
    restart: unless-stopped
    # Recommendation: Duplicati needs root user to get access to all files
    user: "${DOCKER_ROOTPUID:-0}:${DOCKER_ROOTPGID:-0}"
    network_mode: bridge
    ports:
      - 8200:8200
    volumes:
      - ${DOCKER_PATH_PERSISTENT}/duplicati_data:/data:rw
      - ${DOCKER_PATH_PERSISTENT}/duplicati_config/:/config:ro            
      - ${DOCKER_PATH_PERSISTENT}:/source:ro      
    environment:
      - TZ=${DOCKER_TZ}

  diun:
    image: crazymax/diun:4.33.1
    container_name: ${DOCKER_CONTAINER_NAME_PREFIX}_diun
    command: serve
    volumes:
      - "./data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped
    environment:
      - "TZ=${DOCKER_TZ}"
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=0 */6 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
      - "DIUN_NOTIF_TELEGRAM_TOKEN=${BOT_TOKEN}"
      - "DIUN_NOTIF_TELEGRAM_CHATIDS=${CHAT_ID}"
      - "DIUN_NOTIF_TELEGRAM_TEMPLATEBODY=[${DOCKER_CONTAINER_NAME_PREFIX}] {{ .Entry.Image }} has been {{ if (eq .Entry.Status \"new\") }}newly added{{ else }}updated{{ end }}."
    labels:
      - "diun.enable=true"

  dozzle:
    container_name: ${DOCKER_CONTAINER_NAME_PREFIX}_dozzle
    image: amir20/dozzle:v11.3.2
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080

  model-serving:
    image: chaimt/model-server:main
    container_name: ${DOCKER_CONTAINER_NAME_PREFIX}_model_serving
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - TZ=${DOCKER_TZ}
      - log_level=${log_level:-INFO}
      - gemini_api=${gemini_api}
      - hf_token=${hf_token}
      - cpu_threads=${cpu_threads:-4}
      - PYTHONUNBUFFERED=1
    # Add ulimits for large file handling
    ulimits:
      nofile:
        soft: 65536
        hard: 65536


  stirling-pdf:
      image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:3.1.0
      container_name: ${DOCKER_CONTAINER_NAME_PREFIX}stirling-pdf
      ports:
        - "8090:8080"
      volumes:
        - ./StirlingPDF/trainingData:/usr/share/tessdata # Required for extra OCR languages
        - ./StirlingPDF/extraConfigs:/configs
        - ./StirlingPDF/customFiles:/customFiles/
        - ./StirlingPDF/logs:/logs/
        - ./StirlingPDF/pipeline:/pipeline/
      restart: unless-stopped

  opencode:
    image: smanx/opencode:2.1.4
    container_name: ${DOCKER_CONTAINER_NAME_PREFIX}_opencode
    hostname: opencode
    restart: unless-stopped
    ports:
      - "4096:4096"
    volumes:
      - ${DOCKER_PATH_PERSISTENT}/opencode-config:/root/.config/opencode
      - ${DOCKER_PATH_PERSISTENT}/opencode-data:/root/.local/share/opencode
      - ${DOCKER_PATH_PERSISTENT}/opencode-state:/root/.local/state/opencode
      - ${DOCKER_PATH_PERSISTENT}/opencode-workspace:/workspace
      - ${HOME:-/root}/.ssh:/root/.ssh:ro
    environment:
      - TZ=${DOCKER_TZ}
      - OPENCODE_HOSTNAME=0.0.0.0
      - OPENCODE_PORT=4096
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
    labels:
      - "diun.enable=true"

  opencode-ui:
    image: joyki/opencode-ui:latest
    container_name: ${DOCKER_CONTAINER_NAME_PREFIX}_opencode-ui
    hostname: opencode-ui
    restart: unless-stopped
    ports:
      - "4097:4096"
    volumes:
      - ${DOCKER_PATH_PERSISTENT}/opencode-ui-config:/home/opencode/.config/opencode
      - ${DOCKER_PATH_PERSISTENT}/opencode-ui-data:/home/opencode/.local/share/opencode
      - ${DOCKER_PATH_PERSISTENT}/opencode-ui-workspace:/home/opencode/workspace
    environment:
      - TZ=${DOCKER_TZ}
      - OPENCODE_MODE=${OPENCODE_MODE:-web}
      - OPENCODE_PORT=4096
      - OPENCODE_HOSTNAME=0.0.0.0
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "diun.enable=true"


